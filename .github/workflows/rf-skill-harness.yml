name: Publish public GNU Radio RF skill harness
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rf-skill-harness.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-rf-skill-harness
  cancel-in-progress: true
env:
  HARNESS_SOURCE_REVISION: c5d3e452fcc4758fd6b243df0bda743c873bc734
  IMAGE: ghcr.io/wa200508/airsim-rf
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build only the independent harness repository at its source pin
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/wa200508/RF-Skill-Harness.git#${{ env.HARNESS_SOURCE_REVISION }}
          load: true
          tags: airsim-rf:rf-skill-harness-release-test
          build-args: SOURCE_REVISION=${{ env.HARNESS_SOURCE_REVISION }}
          cache-from: type=gha,scope=public-rf-skill-harness
          cache-to: type=gha,scope=public-rf-skill-harness,mode=max
      - name: Qualify GNU Radio, notebooks, plots and source independence offline
        run: |
          docker run --rm --network none -e QT_QPA_PLATFORM=offscreen --entrypoint timeout \
            airsim-rf:rf-skill-harness-release-test 180 \
            python3 -m pytest /opt/rf-skill-harness/tests -q -p no:cacheprovider
          docker run --rm --network none --entrypoint python3 \
            airsim-rf:rf-skill-harness-release-test /opt/rf-skill-harness/scripts/qualify.py
          actual=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' airsim-rf:rf-skill-harness-release-test)
          test "$actual" = "$HARNESS_SOURCE_REVISION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested independent CPU image in the existing public package
        run: |
          immutable="$IMAGE:rf-skill-harness-sha-$HARNESS_SOURCE_REVISION"
          docker tag airsim-rf:rf-skill-harness-release-test "$immutable"
          docker push "$immutable"
          docker tag airsim-rf:rf-skill-harness-release-test "$IMAGE:rf-skill-harness"
          docker push "$IMAGE:rf-skill-harness"
      - name: Verify anonymous pull and installed replay without simulation dependencies
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          immutable="$IMAGE:rf-skill-harness-sha-$HARNESS_SOURCE_REVISION"
          docker --config "$anonymous_config" pull "$immutable"
          docker run --rm --network none --entrypoint python3 "$immutable" \
            /opt/rf-skill-harness/scripts/qualify.py
