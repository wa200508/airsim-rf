name: Publish public Companion browser workbench
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rf-skill-companion-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-rf-skill-companion-browser
  cancel-in-progress: true
env:
  HARNESS_SOURCE_REVISION: 42a654ec06c328700497a833abb438abb5f0f40d
  IMAGE: ghcr.io/wa200508/airsim-rf
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wa200508/RF-Skill-Harness
          ref: ${{ env.HARNESS_SOURCE_REVISION }}
          path: harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Build only the pinned independent Companion browser repository
        uses: docker/build-push-action@v6
        with:
          context: harness
          file: harness/Dockerfile.companion
          load: true
          tags: rf-companion-browser:release-test
          build-args: SOURCE_REVISION=${{ env.HARNESS_SOURCE_REVISION }}
          cache-from: type=gha,scope=public-companion-browser
          cache-to: type=gha,mode=max,scope=public-companion-browser
      - name: Install the browser test client
        run: |
          python -m pip install numpy playwright
          python -m playwright install --with-deps chromium
      - name: Qualify real browser editing, RX/TX plots, export, reconnect and restart
        run: |
          python harness/scripts/qualify_companion_browser.py \
            --image rf-companion-browser:release-test --output "$RUNNER_TEMP/browser-qualification"
          actual=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' rf-companion-browser:release-test)
          test "$actual" = "$HARNESS_SOURCE_REVISION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-companion-browser-qualification
          path: ${{ runner.temp }}/browser-qualification
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the qualified image in the existing public package
        run: |
          immutable="$IMAGE:rf-skill-companion-browser-sha-$HARNESS_SOURCE_REVISION"
          docker tag rf-companion-browser:release-test "$immutable"
          docker push "$immutable"
          docker tag rf-companion-browser:release-test "$IMAGE:rf-skill-companion-browser"
          docker push "$IMAGE:rf-skill-companion-browser"
      - name: Verify anonymous pull
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull "$IMAGE:rf-skill-companion-browser-sha-$HARNESS_SOURCE_REVISION"
