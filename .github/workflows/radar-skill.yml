name: Publish public radar skill image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-skill.yml"
      - "requirements-radar-skill.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-radar-skill
  cancel-in-progress: true
env:
  RADAR_SOURCE_REVISION: a8b8d254dd05d329e42a6c21ef4ac95167bca2cd
  IMAGE: ghcr.io/wa200508/airsim-rf
jobs:
  radar-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check external source pin
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('requirements-radar-skill.txt').read_text()
          pin=re.search(r'/([0-9a-f]{40})\.tar\.gz',text)
          if pin:
              assert pin.group(1)==os.environ['RADAR_SOURCE_REVISION'],'Update release workflow and scenario pins together'
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Build only the independent repository
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/wa200508/Radar-skill.git#${{ env.RADAR_SOURCE_REVISION }}
          load: true
          tags: airsim-rf:radar-skill-release-test
          build-args: SOURCE_REVISION=${{ env.RADAR_SOURCE_REVISION }}
          cache-from: type=gha,scope=public-radar
          cache-to: type=gha,scope=public-radar,mode=max
      - name: Qualify independent image offline
        run: |
          docker run --rm --network none --entrypoint python airsim-rf:radar-skill-release-test scripts/qualify_independence.py
          actual=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' airsim-rf:radar-skill-release-test)
          test "$actual" = "$RADAR_SOURCE_REVISION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested public image
        run: |
          image="$IMAGE:radar-skill-sha-$RADAR_SOURCE_REVISION"
          docker tag airsim-rf:radar-skill-release-test "$image"
          docker push "$image"
      - name: Verify real anonymous pull and replay
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          image="$IMAGE:radar-skill-sha-$RADAR_SOURCE_REVISION"
          docker --config "$anonymous_config" pull "$image"
          docker run --rm --network none --entrypoint python "$image" scripts/qualify_independence.py
