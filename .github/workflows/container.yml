name: Test and publish container

on:
  push:
    branches: [main, "optimization/**", "profiling/p100"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gnuradio:
    name: GNU Radio recording interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install stock GNU Radio and test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnuradio python3-pytest
      - name: Compile and run recorded-IQ flowgraphs with system Python
        run: |
          /usr/bin/python3 -c 'from gnuradio import gr, qtgui; print(gr.version())'
          /usr/bin/python3 -m pytest tests/test_gnuradio_export.py -q -p no:cacheprovider
  container:
    needs: gnuradio
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check source/application architecture boundaries
        run: python3 scripts/check_architecture.py
      - name: Check maintained documentation links
        run: python3 scripts/check_docs.py
      - name: Check synchronized dashboard presentation with delayed video
        run: node --test tests/dashboard_presentation.test.cjs
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: airsim-rf:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests offline as the container user
        run: docker run --rm --network none airsim-rf:test
      - name: Verify real Docker dashboard cleanup and repeat launch
        run: python3 scripts/qualify_dashboard_lifecycle.py --image airsim-rf:test
      - name: Check installed wheel and bundled examples outside the checkout
        run: |
          docker run --rm --network none airsim-rf:test \
            python /opt/airsim-rf/scripts/qualify_wheel_overlay.py \
            --wheel /opt/airsim-rf/local-wheel/airsim_rf-0.2.0-py3-none-any.whl \
            --output /work/package-check
      - name: Smoke test radar I/Q generation
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/examples/distance2gol_radar.py
      - name: Exercise two distributed RF workers offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/examples/distributed_hello.py
      - name: Smoke test COTS SDR network I/Q offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/examples/pluto_esm_drones.py --epochs 2 --samples 1024 --samples-per-link 128 --output-dir /work/pluto_esm
      - name: Smoke test terrain and documentation plots offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/benchmarks/generate_rf_waterfalls.py --epochs 2 --tx 4 --samples-per-link 128 --output-dir /work/figures
      - name: Smoke test terrain features in coherent I/Q offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/benchmarks/generate_terrain_signature.py --scan-points 9 --samples-per-link 128 --output-dir /work/terrain_scan
      - name: Smoke test CPU profiling and report generation offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/scripts/run_gpu_profile.py --cpu-only --quick --tx 2 --samples 1024 --samples-per-link 128 --no-example --no-nsys --no-telemetry --output-root /work/profiling --run-id ci-smoke
      - name: Smoke test sensing-data analysis offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/benchmarks/generate_sensing_figures.py --data-dir /opt/airsim-rf/docs/figures --output-dir /work/sensing
      - name: Smoke test physical scenario figures offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/benchmarks/generate_sensing_scenarios.py --data-dir /opt/airsim-rf/docs/figures --output-dir /work/scenarios
      - name: Validate published sensing products
        run: docker run --rm --network none -w /opt/airsim-rf airsim-rf:test python scripts/check_sensing_products.py
      - name: Check scientific summary scalars
        run: docker run --rm --network none -w /opt/airsim-rf airsim-rf:test python scripts/update_sensing_summary.py --check
      - name: Build GPU RF service (no local image prerequisites)
        run: |
          docker build -f Dockerfile.dashboard --build-arg BASE_IMAGE=airsim-rf:test \
            --build-arg SOURCE_REVISION=${{ github.sha }} --target gpu -t airsim-rf:dashboard-gpu-test .
      - name: Qualify dashboard service dependencies offline without GPU claims
        run: |
          docker run --rm --network none --entrypoint python airsim-rf:dashboard-gpu-test \
            scripts/qualify_dashboard_container.py
          docker run --rm --network none --entrypoint python airsim-rf:dashboard-gpu-test \
            -m pytest tests/test_dashboard.py tests/test_dashboard_container.py -q -p no:cacheprovider
      - name: Verify shared terrain, independent LiDAR and paused camera updates
        run: |
          docker run --rm --network none --shm-size 1g --entrypoint python airsim-rf:dashboard-gpu-test \
            scripts/qualify_dashboard_camera.py
      - name: Build simulator renderer and alias the independently published DF skill
        run: |
          docker build -f Dockerfile.dashboard --build-arg BASE_IMAGE=airsim-rf:test \
            --build-arg SOURCE_REVISION=${{ github.sha }} --target skill -t airsim-rf:dashboard-skill-test .
          docker build -f Dockerfile.dashboard --build-arg BASE_IMAGE=airsim-rf:test \
            --build-arg SOURCE_REVISION=${{ github.sha }} --target render -t airsim-rf:dashboard-render-test .
      - name: Prove standalone RF skill works without simulation dependencies
        run: |
          docker run --rm --network none --entrypoint python airsim-rf:dashboard-skill-test \
            scripts/qualify_independence.py
      - name: Registry tags
        id: meta
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag airsim-rf:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Publish the tested GPU dashboard and optional service images
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          for role in gpu skill render; do
            image="$IMAGE:dashboard-$role"
            docker tag "airsim-rf:dashboard-$role-test" "$image-sha-$REVISION"
            docker push "$image-sha-$REVISION"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              docker tag "airsim-rf:dashboard-$role-test" "$image"
              docker push "$image"
            else
              docker tag "airsim-rf:dashboard-$role-test" "$image-${GITHUB_REF_NAME}"
              docker push "$image-${GITHUB_REF_NAME}"
            fi
          done
      - name: Verify public anonymous dashboard pull
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}:dashboard-gpu
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull "$IMAGE"
