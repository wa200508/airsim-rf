name: Test and publish container

on:
  push:
    branches: [main, "optimization/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: airsim-rf:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests offline as the container user
        run: docker run --rm --network none airsim-rf:test
      - name: Smoke test radar I/Q generation
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/examples/distance2gol_radar.py
      - name: Exercise two distributed RF workers offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/examples/distributed_hello.py
      - name: Smoke test terrain and documentation plots offline
        run: docker run --rm --network none airsim-rf:test python /opt/airsim-rf/benchmarks/generate_rf_waterfalls.py --epochs 2 --tx 4 --samples-per-link 128 --output-dir /work/figures
      - name: Registry tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag airsim-rf:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
