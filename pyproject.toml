[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airsim-rf"
version = "0.1.0"
description = "Experimental ProjectAirSim / Sionna RT complex voltage receiver"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.14.1", "sionna-rt==2.2.0"]

[project.optional-dependencies]
airsim = ["projectairsim>=1.1.0"]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
