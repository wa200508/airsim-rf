# Two receivers on one Linux host. Assign two DIFFERENT GPU IDs/UUIDs.
name: airsim-rf-gpu
services:
  rx0:
    image: ${RF_IMAGE:-ghcr.io/wa200508/airsim-rf:latest}
    network_mode: host
    command: [airsim-rf-worker, --receiver-id, rx0, --backend, cuda, --port, '22100', --grpc-address, 'unix:/sockets/squall-rf-control.sock', --seed, '42']
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes: [rx0-sockets:/sockets]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${RX0_GPU:-0}']
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:22100/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  rx1:
    image: ${RF_IMAGE:-ghcr.io/wa200508/airsim-rf:latest}
    network_mode: host
    command: [airsim-rf-worker, --receiver-id, rx1, --backend, cuda, --port, '22101', --grpc-address, 'unix:/sockets/squall-rf-control.sock', --seed, '43']
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes: [rx1-sockets:/sockets]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${RX1_GPU:-1}']
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:22101/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  couloir-rx0:
    image: registry.gitlab.com/open-arsenal/ams-gra/hello-world-sk/sensors/squall/couloir@sha256:1bfcfdb9b7df511db0fa84e475099321e0d0f2b3e4bece49d20b975e86527690
    network_mode: host
    command: [--config, /config/couloir.toml]
    volumes:
      - rx0-sockets:/sockets
      - ./couloir-rx0.toml:/config/couloir.toml:ro
    depends_on:
      rx0: {condition: service_healthy}
  couloir-rx1:
    image: registry.gitlab.com/open-arsenal/ams-gra/hello-world-sk/sensors/squall/couloir@sha256:1bfcfdb9b7df511db0fa84e475099321e0d0f2b3e4bece49d20b975e86527690
    network_mode: host
    command: [--config, /config/couloir.toml]
    volumes:
      - rx1-sockets:/sockets
      - ./couloir-rx1.toml:/config/couloir.toml:ro
    depends_on:
      rx1: {condition: service_healthy}
volumes:
  rx0-sockets:
  rx1-sockets:
