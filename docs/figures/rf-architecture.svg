<text x="50" y="405" class="head" text-anchor="start">MODEL / HARDWARE LIMITS</text>
<text x="50" y="438" class="small" text-anchor="start">Narrowband Doppler evolves</text>
<text x="50" y="462" class="small" text-anchor="start">over signal time.</text>
<text x="50" y="486" class="small" text-anchor="start">Materials and σ0 are explicit</text>
<text x="50" y="510" class="small" text-anchor="start">uncalibrated assumptions.</text>
<text x="50" y="534" class="small" text-anchor="start">Radar IF runs on the host;</text>
<text x="50" y="558" class="small" text-anchor="start">visibility can use CPU / CUDA.</text>
<text x="50" y="1067" class="small" text-anchor="start">Teal: source flow</text>
<text x="350" y="1067" class="small" style="fill:#2563eb">Blue: receiver I/Q</text>
