<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">AirSim RF: scenario, propagation, I/Q and independent RF skills</title>
<desc id="desc">A shared terrain mesh connects native AirSim motion to one-way Sionna channels and first-order radar scattering. Waveforms and coherent path responses feed receiver filtering, tunable noise and ADC. Only I/Q and hardware metadata reach independent direction-finding or radar skills. Radar commands its own TX/RX configuration. Bulk I/Q supports replay. Source camera and telemetry and independent skill results meet only in the host dashboard.</desc>
